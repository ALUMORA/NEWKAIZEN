services:
  # Servicio actual de la UI vieja: mismo arranque, ahora con FastAPI y las rutas v1 (KAIZEN_ENV
  # sin definir = development). No se toca hasta cortar la UI vieja. Si algún día se le enciende
  # AUTH_REQUIRED, necesita SECRET_KEY propia de 32+ caracteres o no arranca (la de desarrollo es
  # pública). Su CORS ya no es '*': si la UI vieja vive fuera de newkaizen*.vercel.app, agrega su
  # origen en ALLOWED_ORIGINS antes de desplegar.
  - type: web
    name: kaizen-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python backend.py
    plan: free
    envVars:
      - key: PORT
        generateValue: false

  # API v2 para el frontend nuevo: producción, con sesión obligatoria y sin rutas v1.
  - type: web
    name: kaizen-api
    runtime: python
    branch: analizavende
    autoDeploy: true
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python backend.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: KAIZEN_ENV
        value: production
      - key: AUTH_REQUIRED
        value: "true"
      - key: SECRET_KEY
        sync: false
      - key: USERS
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: BANXICO_TOKEN
        sync: false
      - key: FRED_API_KEY
        sync: false
