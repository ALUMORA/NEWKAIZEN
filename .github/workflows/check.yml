# Compuertas de CI: web, api y e2e (Playwright con el API mockeado, sin capturas visuales).
name: check

on:
  push:
    branches: [main, analizavende, alumora]
  pull_request:
    branches: [main, analizavende, alumora]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (lint, typecheck, test, build, bundle)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run bundle

  e2e:
    name: e2e (Playwright, desktop y mobile)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  api:
    name: api (ruff, pytest)
    # 24.04 fijo y no ubuntu-latest: setup-python solo publica 3.11.8 hasta Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.8'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: pytest -q
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "::notice::Todavía no hay tests/: se omite pytest."
          fi
